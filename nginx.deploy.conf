# 生产前端 nginx：静态托管 + /api 反代后端容器。
# SSE 两个生死参数：proxy_buffering off（否则流被 nginx 攒满一块才吐出，打字机变"整段闪现"）、
# proxy_read_timeout 大于后端 180s 的 SseEmitter 超时（否则长回复被 nginx 掐断）。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vue history 路由：未知路径回退 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }
}
